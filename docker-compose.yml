services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodebb
      POSTGRES_PASSWORD: nodebb
      POSTGRES_DB: nodebb
    ports:
      # Exposed on localhost so you can psql in from the host; NodeBB itself
      # reaches Postgres over the internal network, not this port.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 keeps PGDATA in a subdirectory of this mount, so the volume
      # is mounted a level up from the pre-18 path. Matches the prod 'forums'
      # role, also on postgres:18.
      - postgres_data:/var/lib/postgresql
    networks:
      - forums_internal

  nodebb:
    build: ./node-bb
    restart: unless-stopped
    # Run as container-root, not prod's uid 1001. Under rootless Podman
    # container-root maps to the invoking host user, who owns the bind-mounted
    # config.json, so NodeBB can write it; the image's default uid 1001 maps to a
    # subuid that can't, and setup/boot crash with EACCES on config.json.
    user: "0:0"
    ports:
      - "127.0.0.1:4567:4567"
    volumes:
      # Gitignored local config, seeded from example/config.json by `just up`.
      # Mounted writable — NodeBB writes setup and migration state back to
      # config.json on boot, so a ':ro' mount crash-loops with EROFS.
      - ./node-bb/config.local.json:/opt/config/config.json
      - nodebb_uploads:/usr/src/app/public/uploads
    depends_on:
      - postgres
    networks:
      - forums_internal

volumes:
  postgres_data:
  nodebb_uploads:

networks:
  forums_internal:
