name: Publish Docker Image

on:
  push:
    branches:
      - main 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nodebb

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Actions are pinned to commit SHAs, not major tags: a tag moves whenever
    # upstream pushes a release, a SHA cannot. The trailing comment is the
    # release the SHA was taken from; bump both together.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./node-bb
          file: ./node-bb/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Deploy only reads the checkout; it never writes to the repo or registry.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Load SSH private key into ssh-agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Cache Ansible Galaxy collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('deploy/ansible/requirements.yml') }}
      - name: Install Ansible and dependencies
        run: |
          uv tool install --with linode_api4 --with-executables-from ansible-core,ansible-lint ansible
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Deploy
        env:
          LINODE_ACCESS_TOKEN: ${{ secrets.LINODE_READ_ONLY_TOKEN }}
        run: SSH_USER=deploy just deploy

  # End-to-end smoke test of the just-deployed forum, through the real public
  # path (nginx -> NodeBB -> Postgres). A red job here turns the build red, which
  # emails on failure. This is an alarm, not a gate: the deploy has already
  # happened, so it signals "this deploy broke prod" rather than preventing it.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    permissions: {}
    steps:
      # NodeBB's /sping runs a Postgres query before answering 'healthy', so a
      # 200 confirms the app booted and its database is reachable. It goes
      # through nginx's site-wide (not per-IP) render rate limit, shared with
      # every visitor, so scraper load alone can fail it; the failure message
      # says how to tell.
      - name: Smoke-test the deployed forums
        run: |
          url="https://forums.triplea-game.org/sping"
          max_attempts=12
          for attempt in $(seq 1 "$max_attempts"); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Smoke check passed: HTTP $code from $url (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Attempt $attempt: HTTP $code from $url; retrying in 10s"
              sleep 10
            fi
          done
          echo "Smoke check FAILED: $url never returned 200 (last: HTTP $code)."
          echo "The deploy job's loopback check passed, so suspect the public path:"
          echo "503 = nginx's site-wide rate limit (scraper load; re-run this job to confirm),"
          echo "502 = nginx cannot reach NodeBB, 000 = no HTTP response (a 10s timeout, eg: NodeBB"
          echo "hanging on its database, or a DNS/TLS/connection error; the curl error above says which)."
          exit 1

